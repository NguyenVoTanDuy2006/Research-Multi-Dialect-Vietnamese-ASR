[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdv-asr"
version = "0.1.0"
description = "Reusable Vietnamese ASR fine-tuning and benchmarking toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
]

[project.optional-dependencies]
data = ["datasets>=3.0", "kagglehub>=0.3", "pandas>=2.0"]
train = ["torch>=2.2", "transformers>=4.50", "peft>=0.14", "accelerate>=1.0", "datasets>=3.0"]
all = ["datasets>=3.0", "kagglehub>=0.3", "pandas>=2.0", "torch>=2.2",
       "transformers>=4.50", "peft>=0.14", "accelerate>=1.0"]
dev = ["pytest>=8.0", "build>=1.2"]

[project.scripts]
mdv-asr = "mdv_asr.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
